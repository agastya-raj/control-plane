# servers.yaml — Registry of all servers in the infrastructure mesh
#
# This file is the source of truth for what servers exist, how to reach them,
# and what they can do. Populated via protocols/register_server.md.
#
# ─────────────────────────────────────────────────────────────────────────────
schema_version: 1

# Entries live under the `servers` key below. Each entry's key is the server's
# short name (snake_case, unique, should match the SSH alias).
#
# Example entry (for documentation — remove or replace when adding real data):
#
#   gpu:
#     # ── Identity (required) ────────────────────────────────────────────────
#     hostname: "agastya-gpumachine"    # actual hostname (from `hostname`)
#     ssh_alias: "gpu"                  # Host entry in ~/.ssh/config
#     tailscale_ip: "100.72.107.96"     # output of `tailscale ip -4`
#     user: "agastya"                   # default SSH user
#     os: "Ubuntu 24.04 LTS"           # OS/distro (from lsb_release or sw_vers)
#
#     # ── Role + Status (required) ───────────────────────────────────────────
#     roles:                            # what this server is used for
#       - compute                       #   heavy compute / ML training
#       - homelab                       #   self-hosted services
#       - testbed                       #   research testbed
#       - dev                           #   development machine
#       - media                         #   media server
#       - sandbox                       #   sandboxed execution environment
#       # List is extensible — add custom roles as needed (e.g., hpc, storage).
#     status: active                    # active | offline | decommissioned
#                                       #   active = reachable and in use
#                                       #   offline = exists but not currently reachable
#                                       #   decommissioned = no longer in service
#
#     # ── Network (optional) ─────────────────────────────────────────────────
#     gateway: null                     # server key to jump through (ProxyJump)
#                                       #   e.g., gateway: gpu → reach via gpu
#                                       #   only single-hop supported; chaining not yet defined
#     ports: []                         # notable open ports (informational)
#     domain: null                      # base domain if serving web (e.g., "sudosu.fyi")
#
#     # ── Capabilities (required) ────────────────────────────────────────────
#     # Flat list for querying ("find a server with gpu").
#     # Add a capability after the software/hardware is confirmed present.
#     capabilities:
#       - gpu                           # has NVIDIA GPU
#       - docker                        # Docker installed and running
#       - caddy                         # Caddy reverse proxy
#       - ollama                        # Ollama LLM inference
#       - jupyter                       # Jupyter notebook server
#       - tailscale                     # Tailscale connected (should be all)
#       - claude_code                   # Claude Code installed
#       - symphony                      # Symphony orchestration installed
#       - et                            # Eternal Terminal installed
#
#     # ── Hardware (optional, but recommended) ───────────────────────────────
#     hardware:
#       cpu: "Intel i9-13900K"
#       cores: 24                       # physical cores
#       threads: 48                     # logical threads
#       ram_gb: 64
#       disk_gb: 1000                   # root partition size
#       gpu_model: "RTX 4090"           # omit if no GPU
#       gpu_vram_gb: 24                 # omit if no GPU
#
#     # ── Services (optional) ────────────────────────────────────────────────
#     # Key services running on this server. Used by health checks and deploy
#     # protocols to understand what's expected to be running.
#     services:
#       - name: "caddy"
#         type: systemd                 # systemd | docker | binary
#         port: 443
#       - name: "ollama"
#         type: systemd
#         port: 11434
#
#     # ── Metadata (optional) ────────────────────────────────────────────────
#     notes: "Primary GPU workstation"  # free-form notes for agent context
#     added: "2026-03-25"              # date registered (YYYY-MM-DD)
#     last_audit: "2026-03-25"         # date of last hardware/service audit

servers:

  gpu:
    hostname: "agastya-gpumachine"
    ssh_alias: "gpu"
    tailscale_ip: "100.72.107.96"
    user: "agastya"
    os: "Ubuntu 24.04 LTS"

    roles:
      - compute
      - homelab
    status: active

    gateway: null
    ports: [80, 443, 8001]              # notable externally-accessible ports (not all service ports)
    domain: "sudosu.fyi"

    capabilities:
      - tailscale
      - gpu
      - docker
      - caddy
      - ollama
      - jupyter
      - 1password-cli                    # 1Password CLI + service-account token at /etc/1password/tokens/gpu-apps

    hardware:
      cpu: "13th Gen Intel Core i9-13900K"
      cores: 24
      threads: 48
      ram_gb: 64
      disk_gb: 984
      gpu_model: "NVIDIA GeForce RTX 4090"
      gpu_vram_gb: 24

    # Services: what's actually running on this server (for health checks).
    # Not all services are registered apps — see apps.yaml for the registered subset.
    services:
      - name: "caddy"
        type: systemd
        port: 443
      - name: "sudosu-dashboard"
        type: systemd
        port: 8180
      - name: "marker_server"
        type: binary
        port: 8001
      - name: "ollama"
        type: systemd
        port: 11434
      - name: "jupyter"
        type: systemd
        port: 4839
      - name: "docker"
        type: systemd
        port: null

    notes: "Primary GPU workstation. Runs homelab services behind Caddy (*.sudosu.fyi). Many legacy Docker containers still running — cleanup pending."
    added: "2026-03-25"
    last_audit: "2026-03-25"

  claude:
    hostname: "claude-server"
    ssh_alias: "claude"
    tailscale_ip: "100.110.125.66"
    user: "claude"
    os: "Ubuntu 24.04 LTS"

    roles:
      - sandbox
    status: active

    gateway: null
    ports: []
    domain: null

    capabilities:
      - tailscale
      - docker

    hardware:
      cpu: "Intel Core i7-8650U"
      cores: 4
      threads: 4
      ram_gb: 15
      disk_gb: 229

    services:
      - name: "docker"
        type: systemd
        port: null

    notes: "Dedicated sandbox server for Claude agents. Fresh install, no apps deployed. Has Node.js v22, Python 3.12, Rust/Cargo. ~/projects/ and ~/scratch/ prepared for use."
    added: "2026-03-25"
    last_audit: "2026-03-25"

  deploy:
    hostname: "deploy"
    ssh_alias: "deploy"
    tailscale_ip: "100.100.165.81"
    public_ipv4: "57.128.214.221"
    public_ipv6: "2001:41d0:601:1100::330b"
    provider: "ovh"
    user: "ubuntu"
    os: "Ubuntu 25.04"

    roles:
      - deploy                          # deployment target for websites/services
      - homelab
    status: active

    gateway: null
    ports: [22, 80, 443]
    domain: null                        # no domain attached yet

    capabilities:
      - tailscale
      - docker
      - caddy
      - doppler                         # Doppler CLI + service token at /etc/doppler/token
      - nvm
      - node
      - uv
      - python3
      - fail2ban
      - ufw
      - rclone                          # SFTP mount of ucc:~ at /mnt/ucc (systemd: rclone-ucc)

    hardware:
      cpu: "Intel Core Processor (Haswell, no TSX)"
      cores: 6
      threads: 6
      ram_gb: 12
      disk_gb: 96

    mounts:
      - path: /mnt/ucc                  # ucc storage box (Ultra.cc), ~17 TB via rclone SFTP
        source: "ucc:~/"
        backend: rclone-sftp
        service: rclone-ucc.service

    services:
      - name: "caddy"
        type: systemd
        port: 443
      - name: "docker"
        type: systemd
        port: null
      - name: "tailscaled"
        type: systemd
        port: null
      - name: "fail2ban"
        type: systemd
        port: null
      - name: "ssh"
        type: systemd                   # socket-activated via ssh.socket
        port: 22
      - name: "rclone-ucc"
        type: systemd
        port: null

    notes: |
      OVH VPS, bought 2026-04-18. Deployment center for personal websites/services.
      Three-tier Caddy setup on the same box:
        1. Public canonical — agastya.cc, www.agastya.cc (Cloudflare orange cloud, Full SSL, tls internal on origin) → 404 placeholder.
        2. Public redirect  — agastya-raj.com, www.agastya-raj.com → 301 to agastya.cc (URI preserved).
        3. Tailnet-only      — sudosu.fyi, *.sudosu.fyi (DNS-only A → 100.100.165.81; bound to tailscale interface; real Let's Encrypt wildcard cert via DNS-01 from Mac).
      Cert pipeline runs from Mac (acme.sh + Cloudflare DNS-01), not from deploy — Cloudflare rate-limits the VPS's OVH IP with HTTP 429 code 971 on every API call. Mac cron at 11:58 renews and scp's cert to /etc/caddy/certs/ + reloads Caddy.
      Key-only SSH, UFW 22/80/443, fail2ban, unattended-upgrades, key-only sudo.
      /mnt/ucc is the ucc storage box mounted via rclone SFTP (17 TB).
      Current cert: valid 2026-04-18 → 2026-07-17 (ECC P-256).
      No apps deployed yet. Claude Code install deferred.
      See: ~/code/vps_setup/README.md for ops reference.
    added: "2026-04-18"
    last_audit: "2026-04-18"

  ucc:
    hostname: "orbit"                   # shared-hosting hostname on Ultra.cc
    ssh_alias: "ucc"
    tailscale_ip: "100.77.214.101"      # ping works; SSH over tailnet REFUSED (userspace-networking limit)
    public_ipv4: "46.232.211.65"        # primary SSH path is via this public IP (key auth)
    provider: "ultra.cc"
    user: "oggyraj"
    os: "Debian 11 (bullseye)"

    roles:
      - storage
    status: active

    gateway: null
    ports: []                           # Ultra.cc assigns ephemeral port slots; apps listen on 178xx range
    domain: null

    capabilities:
      - tailscale                       # userspace-networking only; app-tailscale wrapper (not systemd)
      - storage
      - filebrowser                     # web file manager, auth'd, loopback :17828 fronted by nginx :17840
      - webdav                          # available via filebrowser
      - plex                            # installed via app-plex
      - sonarr
      - radarr
      - bazarr
      - prowlarr
      - overseerr
      - tautulli
      - maintainerr
      - homarr                          # dashboard

    hardware:
      cpu: "shared (unknown)"
      cores: null
      threads: null
      ram_gb: null
      disk_gb: 17000                    # 17 TB seedbox plan

    services: []                        # managed by Ultra.cc wrappers, not user-visible systemd

    notes: "Shared seedbox from Ultra.cc (ultra.cc). NOT a regular Linux host: no sudo, apps run inside namespaced containers, tailscaled is started by app-tailscale with userspace-networking and a static tailscale-serve config forwarding ports 17800–17815 to host.docker.internal. SSH over tailscale IP does NOT work — use public IPv4 46.232.211.65. Apps in ~/.apps managed via 'app-<name>' wrappers (install/start/stop/restart/upgrade). Home layout includes ~/storage, ~/media, ~/downloads, ~/webdav, ~/www, ~/zotero — mounted on 'deploy' at /mnt/ucc via rclone SFTP."
    added: "2026-04-18"
    last_audit: "2026-04-18"
